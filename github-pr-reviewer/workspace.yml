version: '1.0'
workspace:
  name: GitHub PR Reviewer
  description: Reviews GitHub pull requests on demand and posts inline findings
tools:
  mcp:
    client_config:
      timeout:
        progressTimeout: 2m
        maxTotalTimeout: 30m
    servers:
      github:
        transport:
          type: http
          url: https://api.githubcopilot.com/mcp
        auth:
          type: bearer
          token_env: GH_TOKEN
signals:
  review-pr:
    description: Trigger a pull request review
    schema:
      type: object
      properties:
        pr_url:
          type: string
          description: Full GitHub pull request URL (e.g. https://github.com/owner/repo/pull/123)
      required:
      - pr_url
    provider: http
    config:
      path: /review-pr
jobs:
  review-pr-job:
    description: Reviews a GitHub PR on demand and posts findings as an inline GitHub
      review
    triggers:
    - signal: review-pr
    fsm:
      initial: idle
      states:
        idle:
          'on':
            review-pr:
              target: run
        run:
          entry:
          - type: agent
            agentId: pr-reviewer
            prompt: 'Review this pull request and post an inline GitHub review with
              your findings.


              pr_url: {{ signal.data.pr_url }}'
          - type: emit
            event: DONE
          'on':
            DONE:
              target: done
        done:
          type: final
agents:
  pr-reviewer:
    description: Reviews a GitHub pull request and posts an inline review with findings
    type: llm
    config:
      provider: anthropic
      model: claude-sonnet-4-6
      prompt: "You are a thorough senior code reviewer.\n\n1. Call `pull_request_read`\
        \ with method \"get\" to fetch PR metadata (title, body, base/head branch,\
        \ author).\n\n2. Call `pull_request_read` with method \"get_files\" to get\
        \ the list of changed files.\n\n3. Call `pull_request_read` with method \"\
        get_diff\" to fetch the full diff.\n\n4. Call `get_file_contents` for any\
        \ files where you need broader context beyond the diff.\n\n5. Analyze the\
        \ changes for:\n   - Correctness / logic bugs\n   - Security issues (injection,\
        \ auth, secret exposure)\n   - Error handling gaps\n   - Naming / style issues\n\
        \n6. Call `pull_request_review_write` with method \"create\" (omit \"event\"\
        \ to create a pending review), then use `add_comment_to_pending_review` for\
        \ each inline finding. Finally call `pull_request_review_write` with method\
        \ \"submit_pending\" and the appropriate event (APPROVE, REQUEST_CHANGES,\
        \ or COMMENT).\n\nREQUIRED: Call complete() with the verdict and a one-line\
        \ summary of findings. The job will time out if complete() is not called."
      temperature: 0.3
      tools:
      - github/pull_request_read
      - github/get_file_contents
      - github/list_commits
      - github/pull_request_review_write
      - github/add_comment_to_pending_review
      - github/add_issue_comment
      - github/search_code
memory:
  own:
  - name: notes
    type: short_term
    strategy: narrative
  - name: memory
    type: long_term
    strategy: narrative
  mounts:
  - name: user-notes
    source: user/narrative/notes
    mode: ro
    scope: workspace
  - name: user-memory
    source: user/narrative/memory
    mode: ro
    scope: workspace
