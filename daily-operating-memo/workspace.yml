version: '1.0'
workspace:
  name: Daily Operating Memo
  description: Pulls Google Calendar and Gmail every morning and sends a prioritized
    daily briefing to your inbox
tools:
  mcp:
    client_config:
      timeout:
        progressTimeout: 2m
        maxTotalTimeout: 30m
    servers:
      google-gmail:
        transport:
          type: http
          url: http://localhost:8002/mcp
        client_config:
          timeout:
            progressTimeout: 60s
            maxTotalTimeout: 30m
        auth:
          type: bearer
          token_env: GOOGLE_GMAIL_ACCESS_TOKEN
        env:
          GOOGLE_GMAIL_ACCESS_TOKEN:
            from: link
            provider: google-gmail
            key: access_token
        startup:
          type: command
          command: uvx
          args:
          - workspace-mcp
          - --tools
          - gmail
          - --transport
          - streamable-http
          env:
            WORKSPACE_MCP_PORT: '8002'
          ready_url: http://localhost:8002/mcp
      google-calendar:
        transport:
          type: http
          url: http://localhost:8001/mcp
        client_config:
          timeout:
            progressTimeout: 60s
            maxTotalTimeout: 30m
        auth:
          type: bearer
          token_env: GOOGLE_CALENDAR_ACCESS_TOKEN
        env:
          GOOGLE_CALENDAR_ACCESS_TOKEN:
            from: link
            provider: google-calendar
            key: access_token
        startup:
          type: command
          command: uvx
          args:
          - workspace-mcp
          - --tools
          - calendar
          - --transport
          - streamable-http
          env:
            WORKSPACE_MCP_PORT: '8001'
          ready_url: http://localhost:8001/mcp
signals:
  run-daily-memo:
    description: Fires every weekday at 7:30am Pacific to trigger the daily operating
      memo.
    provider: schedule
    config:
      schedule: 30 7 * * 1-5
      timezone: America/Los_Angeles
jobs:
  daily-memo:
    description: Fetches today's calendar and email priorities, composes a daily memo,
      and sends it to your inbox.
    triggers:
    - signal: run-daily-memo
    fsm:
      initial: idle
      states:
        idle:
          'on':
            run-daily-memo:
              target: fetch-calendar
        fetch-calendar:
          entry:
          - type: agent
            agentId: calendar-fetcher
            outputTo: calendar-result
          - type: emit
            event: DONE
          'on':
            DONE:
              target: fetch-email
        fetch-email:
          entry:
          - type: agent
            agentId: gmail-fetcher
            outputTo: email-result
          - type: emit
            event: DONE
          'on':
            DONE:
              target: compose-and-send
        compose-and-send:
          entry:
          - type: agent
            agentId: memo-composer
            inputFrom:
            - calendar-result
            - email-result
            outputTo: memo-result
          - type: emit
            event: DONE
          'on':
            DONE:
              target: done
        done:
          type: final
agents:
  calendar-fetcher:
    description: Fetches today's calendar events and formats them into a structured
      briefing block.
    type: llm
    config:
      provider: anthropic
      model: claude-haiku-4-5
      prompt: 'You are fetching today''s Google Calendar events for a daily operating
        memo.


        The current date, time, and timezone are injected into your context via the
        signal payload or system context. Use them to construct today''s full-day
        window in ISO 8601 format — from midnight (00:00:00) to end of day (23:59:59)
        in the user''s LOCAL timezone. Do NOT use UTC midnight as the start — that
        would miss events earlier in the day.


        Do the following:

        1. Call `google-calendar/list_calendars` to get the user''s calendars.

        2. Call `google-calendar/get_events` for the primary calendar using today''s
        FULL day range in the local timezone as described above.

        3. Return a structured text block titled **📅 TODAY''S CALENDAR** listing ALL
        events for the full day with: time (in local time), title, duration, attendees
        (if any), and location/meeting link. Sort chronologically.

        4. Flag any event starting within the next 2 hours with a ⚡ prefix.

        5. If no events, say ''No events scheduled today.''


        6. REQUIRED: Call complete() with a brief summary of what was done. The job
        will time out if complete() is not called.'
      temperature: 0.3
      tools:
      - google-calendar/list_calendars
      - google-calendar/get_events
  gmail-fetcher:
    description: Scans the inbox for emails requiring attention today and surfaces
      the most important ones.
    type: llm
    config:
      provider: anthropic
      model: claude-haiku-4-5
      prompt: "You are scanning Gmail for the daily operating memo.\n\nDo the following:\n\
        1. Call `google-gmail/search_gmail_messages` with query `is:unread newer_than:1d`\
        \ to find recent unread emails.\n2. Call `google-gmail/search_gmail_messages`\
        \ again with query `is:important newer_than:2d` to find important/starred\
        \ items.\n3. Fetch content for up to the 10 most relevant messages using `google-gmail/get_gmail_messages_content_batch`.\n\
        4. Return a structured block titled **\U0001F4EC EMAIL PRIORITIES** with:\n\
        \   - Items needing a reply today (mark with \U0001F534)\n   - Items to be\
        \ aware of but no action needed (mark with \U0001F7E1)\n   - Any deadlines\
        \ or time-sensitive threads (mark with ⏰)\n5. Keep each item to one line:\
        \ sender, subject, and a 5-word summary of what's needed.\n6. If inbox is\
        \ clear, say 'No urgent emails.'\n\n7. REQUIRED: Call complete() with a brief\
        \ summary of what was done. The job will time out if complete() is not called."
      temperature: 0.3
      tools:
      - google-gmail/search_gmail_messages
      - google-gmail/get_gmail_messages_content_batch
      - google-gmail/get_gmail_message_content
  memo-composer:
    description: Synthesizes calendar and email data into a prioritized daily memo
      and emails it.
    type: llm
    config:
      provider: anthropic
      model: claude-sonnet-4-6
      prompt: 'You are composing and sending a daily operating memo.


        You have received two data blocks as input:

        - calendar-result: Today''s calendar events

        - email-result: Email priorities


        Do the following:


        1. Compose a daily memo email with the subject: "Your Daily Operating Memo
        — [Today''s Date]"


        2. Structure the email body exactly as follows:


        ---

        Good morning.


        Here''s what needs your attention today.


        **TOP PRIORITIES**

        [Synthesize the most important actionable items from the calendar and email
        data. Be specific — "Reply to Alex re: Q3 budget" not "check email"]


        [Paste the full CALENDAR block]


        [Paste the full EMAIL PRIORITIES block]

        ---


        3. Send the email to YOUR_EMAIL_ADDRESS using `google-gmail/send_gmail_message`.


        Do NOT infer, guess, or use any email address found in the calendar or email
        data. If the recipient is ever unclear, stop and return an error instead of
        guessing.


        4. After sending, return a one-line confirmation.


        5. REQUIRED: Call complete() with a brief summary of what was done. The job
        will time out if complete() is not called.'
      temperature: 0.3
      tools:
      - google-gmail/send_gmail_message
memory:
  own:
  - name: notes
    type: short_term
    strategy: narrative
  - name: memory
    type: long_term
    strategy: narrative
  mounts:
  - name: user-notes
    source: user/narrative/notes
    mode: ro
    scope: workspace
  - name: user-memory
    source: user/narrative/memory
    mode: ro
    scope: workspace
