name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run yamllint
        uses: karancode/yamllint-github-action@v3.0.0
        with:
          yamllint_strict: true
          yamllint_config_filepath: .yamllint.yml

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: "**/*.md"

  folder-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enforce kebab-case example folders
        run: |
          set -euo pipefail
          pattern='^[a-z0-9]+(-[a-z0-9]+)*$'
          fail=0
          check() {
            local dir=$1
            for entry in "$dir"/*/; do
              [ -d "$entry" ] || continue
              name=$(basename "$entry")
              if ! [[ $name =~ $pattern ]]; then
                echo "::error file=$entry::Folder '$name' must be kebab-case (see CONTRIBUTING.md)"
                fail=1
              fi
            done
          }
          # Example workspaces live at the repo root; their assets mirror the name.
          for entry in */; do
            name=$(basename "$entry")
            case $name in
              .github|.claude|.git|assets|site|node_modules|scripts) continue ;;
            esac
            if ! [[ $name =~ $pattern ]]; then
              echo "::error file=$entry::Folder '$name' must be kebab-case (see CONTRIBUTING.md)"
              fail=1
            fi
          done
          [ -d assets ] && check assets
          exit $fail

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout friday-studio (for canonical @atlas/config schema)
        uses: actions/checkout@v7
        with:
          repository: friday-platform/friday-studio
          ref: '0.1.8'
          path: .friday-studio
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate examples.json + workspace.yml against canonical schema
        run: deno run --allow-read --allow-env --allow-sys --config .friday-studio/deno.json scripts/validate_examples.ts
