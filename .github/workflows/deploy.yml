name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build zips
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          jq -r '.[].folder' examples.json | while read -r folder; do
            if [ -z "$folder" ]; then continue; fi
            if [ ! -d "$folder" ]; then
              echo "::error::Folder '$folder' listed in examples.json does not exist"
              exit 1
            fi
            echo "Zipping $folder"
            zip -r "site/downloads/$folder.zip" "$folder" -x '*.DS_Store'
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
