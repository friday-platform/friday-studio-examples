version: '1.0'
workspace:
  name: GitHub Digest
  description: Scheduled GitHub PR and review digest every Monday and Thursday
tools:
  mcp:
    client_config:
      timeout:
        progressTimeout: 2m
        maxTotalTimeout: 30m
    servers:
      github:
        transport:
          type: http
          url: https://api.githubcopilot.com/mcp
        auth:
          type: bearer
          token_env: GH_TOKEN
signals:
  github-digest-schedule:
    description: Fires every Monday and Thursday at 8:30am Pacific
    provider: schedule
    config:
      schedule: 30 8 * * 1,4
      timezone: America/Los_Angeles
jobs:
  github-digest-job:
    description: 'Every Monday and Thursday: summarize open PRs and review requests
      for the GitHub user'
    triggers:
    - signal: github-digest-schedule
    fsm:
      initial: idle
      states:
        idle:
          'on':
            github-digest-schedule:
              target: run
        run:
          entry:
          - type: agent
            agentId: github-digest-agent
            outputTo: digest-result
          - type: emit
            event: DONE
          'on':
            DONE:
              target: done
        done:
          type: final
agents:
  github-digest-agent:
    description: Fetches open PRs and review requests for the authenticated GitHub
      user, then produces a concise digest grouped by repository.
    type: llm
    config:
      provider: anthropic
      model: claude-sonnet-4-6
      prompt: 'You are a GitHub digest assistant.


        1. Call `get_me` to find the authenticated user''s login.


        2. Call `list_pull_requests` filtering for open PRs authored by the user across
        their repos.


        3. Call `list_pull_requests` filtering for PRs where review is requested from
        the user.


        4. Group results by repository. For each PR include: title, number, URL, author,
        and age in days (calculated from created_at).


        5. Produce a concise digest sorted by oldest first within each group.


        REQUIRED: Call complete() with a summary of how many PRs were found across
        how many repos. The job will time out if complete() is not called.'
      temperature: 0.3
      tools:
      - github/get_me
      - github/list_pull_requests
memory:
  own:
  - name: notes
    type: short_term
    strategy: narrative
  - name: memory
    type: long_term
    strategy: narrative
  mounts:
  - name: user-notes
    source: user/narrative/notes
    mode: ro
    scope: workspace
  - name: user-memory
    source: user/narrative/memory
    mode: ro
    scope: workspace
